<!DOCTYPE html>
<html lang="pt-BR"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestão · Das Stammhaus Pub</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--verde:#113325;--ouro:#B47E00;--laranja:#E04E27;--off:#EAE7DA;--escuro:#0a2016;--ok:#7fd18b}
*{box-sizing:border-box}html,body{margin:0;background:var(--verde);color:var(--off);font-family:Inter,system-ui,sans-serif;line-height:1.45}
body{min-height:100vh;background:radial-gradient(ellipse at top,#1a4a31 0%,#113325 55%,#0b2418 100%) fixed}
.wrap{max-width:1040px;margin:0 auto;padding:22px 14px 60px}
h1{font-family:'Playfair Display',Georgia,serif;font-size:26px;margin:0 0 2px}
h2{font-family:'Playfair Display',Georgia,serif;font-size:19px;margin:0}
.sub{color:#b9b5a6;font-size:13.5px;margin:0 0 16px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
button,select,input{font:inherit}
button{font-weight:600;cursor:pointer;border-radius:8px;border:1.5px solid rgba(234,231,218,.4);background:transparent;color:var(--off);padding:7px 12px}
button:hover{border-color:var(--ouro)}button.p{background:var(--ouro);border-color:var(--ouro);color:#fff}button.d{border-color:var(--laranja);color:#ffb59f}
button.s{padding:4px 9px;font-size:12.5px}button:disabled{opacity:.5;cursor:default}
.noites{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin:14px 0}
.n{background:rgba(0,0,0,.28);border:1.5px solid rgba(234,231,218,.18);border-radius:12px;padding:12px;cursor:pointer}
.n.on{border-color:var(--ouro);background:rgba(180,126,0,.14)}
.n h3{margin:0;font-size:15px}.n small{color:#b9b5a6;display:block}
.bar{height:9px;border-radius:6px;background:rgba(255,255,255,.12);overflow:hidden;margin:8px 0 6px;display:flex}
.bar i{display:block;height:100%}.b1{background:#7fd18b}.b2{background:#e8c25a}.b3{background:#5aa6e8}
.big{font-size:26px;font-weight:700}.lot{color:#ffb59f;font-weight:700}
.kp{display:flex;gap:6px;flex-wrap:wrap;font-size:12.5px;color:#d6d2c2}.kp b{color:var(--off)}
.leg{display:flex;gap:12px;font-size:12px;color:#b9b5a6;margin:2px 0 10px;flex-wrap:wrap}.leg span:before{content:'';display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.l1:before{background:#7fd18b}.l2:before{background:#e8c25a}.l3:before{background:#5aa6e8}
.card{background:rgba(0,0,0,.28);border:1.5px solid rgba(234,231,218,.18);border-radius:12px;padding:14px;margin:12px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.sp{justify-content:space-between}
.tb{width:100%;border-collapse:collapse;font-size:13.5px}.tb th{text-align:left;color:#b9b5a6;font-weight:600;font-size:12px;padding:4px 6px;border-bottom:1px solid rgba(234,231,218,.2)}
.tb td{padding:6px;border-bottom:1px solid rgba(234,231,218,.1);vertical-align:middle}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600}
.t-c{background:#1f5b33;color:#cdf3d3}.t-p{background:#6b5410;color:#ffe9a8}.t-n{background:#6a2a1c;color:#ffc9b9}
input[type=text],input[type=search],select{background:#0a2016;color:var(--off);border:1.5px solid rgba(234,231,218,.3);border-radius:8px;padding:7px 9px;max-width:100%}
.res{border:1px solid rgba(234,231,218,.15);border-radius:10px;padding:9px;margin:8px 0}
.err{background:#5a1d12;border-radius:10px;padding:14px;margin:20px 0}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:14px;z-index:9}
.mod{background:#143a2a;border:1.5px solid var(--ouro);border-radius:14px;padding:18px;max-width:440px;width:100%;max-height:90vh;overflow:auto}
.mod label{display:block;font-size:12.5px;color:#cfcbbb;margin:9px 0 3px}.mod input,.mod select{width:100%}
.warn{background:#5a3b0a;border-radius:8px;padding:8px 10px;margin:10px 0;font-size:13px}.bad{color:#ffb59f;font-size:13px;margin-top:8px}
.aud{font-size:12.5px;color:#cfcbbb}.aud div{padding:3px 0;border-bottom:1px solid rgba(234,231,218,.08)}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ouro);color:#fff;padding:9px 16px;border-radius:10px;font-weight:600;z-index:10}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button.on{background:var(--off);color:var(--verde);border-color:var(--off)}
</style></head><body><div class="wrap">

<script>
var K=<?!= JSON.stringify(k) ?>,S=null,SEL=null,TAB='conv',BUSCA='',FIL='todos',busy=false;
function $(i){return document.getElementById(i)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function run(fn,args,ok){var g=google.script.run.withSuccessHandler(ok).withFailureHandler(function(e){busy=false;toast('Falha: '+(e&&e.message||e))});g[fn].apply(g,args)}
function toast(t){var d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(function(){d.remove()},3200)}
function msgErro(r){var c=r&&r.code;return c==='negado'?'Acesso negado. O link está incorreto ou foi desativado.':c==='sem_permissao'?'Este link não tem permissão de gestão.':c==='limite'?'Muitas tentativas. Aguarde alguns minutos.':c==='nao_encontrado'?'Registro não encontrado (já foi alterado?). Atualize a página.':c==='duplicado'?'Já existe um convidado com esse nome.':c==='tem_acompanhante'?'Este convidado confirmou com acompanhante. Altere o status antes de remover o acompanhante.':c==='mesmo_dia'?'A pessoa já está nessa noite.':c==='ultima_pessoa'?'É a última pessoa da reserva. Cancele a reserva inteira.':c==='max_pessoas'?'Máximo de '+r.max+' pessoas por reserva.':c==='tel_duplicado'||c==='invalido'?(r.msg||'Dados inválidos.'):r&&r.erro?'Erro '+esc(r.erro.codigo)+' · ref '+esc(r.erro.ref):'Não foi possível concluir.'}
function carregar(){if(!K){$('app').innerHTML='<div class="err">Link sem chave de acesso. Peça o link completo a quem administra.</div>';$('sub').textContent='';return}
 run('gestao',[K],draw)}
function draw(r){busy=false;if(!r||r.ok===false){$('app').innerHTML='<div class="err">'+msgErro(r)+'</div>';$('sub').textContent='';return}
 S=r;if(SEL==null||!S.noites.some(function(n){return n.dia===SEL}))SEL=S.noites.length?S.noites[0].dia:null;
 $('sub').textContent='Olá, '+r.quem+' · teto '+r.teto+' pessoas por noite · atualizado em '+r.geradoEm;render()}
function noite(d){return S.noites.filter(function(n){return n.dia===d})[0]}
function render(){var h='<div class="leg"><span class="l1">Confirmados</span><span class="l2">Sem resposta (contados)</span><span class="l3">Reservas do público</span></div><div class="noites">';
 S.noites.forEach(function(n){var t=S.teto,w=function(v){return Math.min(100,100*v/t)};
  h+='<div class="n'+(n.dia===SEL?' on':'')+'" data-d="'+n.dia+'"><h3>Noite '+n.dia+' · '+esc(n.label)+'</h3><small>'+esc(n.atracao)+'</small>'+
  '<div class="bar"><i class="b1" style="width:'+w(n.confirmadosPessoas)+'%"></i><i class="b2" style="width:'+w(n.pendentesPessoas)+'%"></i><i class="b3" style="width:'+w(n.publico)+'%"></i></div>'+
  '<div><span class="big">'+n.total+'</span> / '+t+(n.lotado?' <span class="lot">LOTADO</span>':' · '+n.restantes+' vagas')+(n.total>t?' <span class="lot">(+'+(n.total-t)+' acima)</span>':'')+'</div>'+
  '<div class="kp"><span><b>'+n.confirmadosPessoas+'</b> conf.</span><span><b>'+n.pendentesConvites+'</b> pend.</span><span><b>'+n.naoVaiConvites+'</b> não vão</span><span><b>'+n.publico+'</b> público</span></div></div>'});
 h+='</div>';
 var tt={conf:0,pend:0,nao:0,pub:0,tot:0};S.noites.forEach(function(n){tt.conf+=n.confirmadosPessoas;tt.pend+=n.pendentesPessoas;tt.nao+=n.naoVaiConvites;tt.pub+=n.publico;tt.tot+=n.total});
 h+='<div class="card row sp"><span><b>Semana:</b> '+tt.tot+' pessoas comprometidas · '+tt.conf+' confirmadas · '+tt.pend+' sem resposta · '+tt.nao+' convites "não vai" · '+tt.pub+' do público</span><span>Receita de ingressos (público): <b>R$ '+(tt.pub*S.valor)+'</b></span></div>';
 if(SEL!=null)h+=detalhe(noite(SEL));
 h+='<div class="card"><h2>Últimas alterações da gestão</h2><div class="aud" id="aud">'+(S.auditoria.length?S.auditoria.map(function(a){return'<div>'+esc(a.quando)+' · <b>'+esc(a.quem)+'</b> · '+esc(a.acao)+' — '+esc(a.det)+'</div>'}).join(''):'<div>Nenhuma alteração registrada.</div>')+'</div></div>';
 $('app').innerHTML=h}
function detalhe(n){var h='<div class="card"><div class="row sp"><h2>Noite '+n.dia+' · '+esc(n.label)+'</h2><div class="tabs"><button class="'+(TAB==='conv'?'on':'')+'" data-tab="conv">Convidados</button><button class="'+(TAB==='res'?'on':'')+'" data-tab="res">Reservas do público</button></div></div>';
 if(TAB==='conv'){
  var L=S.convidados.filter(function(c){return c.dia===n.dia});
  var q=norm(BUSCA);if(q)L=L.filter(function(c){return norm(c.nome+' '+c.titNome+' '+c.acNome).indexOf(q)>=0});
  if(FIL!=='todos')L=L.filter(function(c){return c.status===FIL});
  h+='<div class="row" style="margin:10px 0"><input type="search" id="busca" placeholder="Buscar nome…" value="'+esc(BUSCA)+'"><select id="fil">'+['todos','Confirmado','Pendente','Não vai'].map(function(f){return'<option'+(f===FIL?' selected':'')+'>'+f+'</option>'}).join('')+'</select><button class="p s" id="addc">+ Incluir convidado</button></div>';
  h+='<table class="tb"><tr><th>Convidado</th><th>Status</th><th>Pessoas</th><th>Contato</th><th></th></tr>';
  L.forEach(function(c){var tg=c.status==='Confirmado'?'t-c':c.status==='Pendente'?'t-p':'t-n';
   h+='<tr><td>'+esc(c.nome)+(c.acomp?' <small>(+1)</small>':'')+(c.acNome?'<br><small>c/ '+esc(c.acNome)+'</small>':'')+'</td><td><span class="tag '+tg+'">'+c.status+'</span></td><td>'+c.pessoas+'</td><td><small>'+esc(c.titTel)+'</small></td>'+
   '<td><button class="s" data-a="mc" data-id="'+c.id+'">Mudar de dia</button> <button class="s" data-a="ec" data-id="'+c.id+'">Status</button> <button class="s" data-a="ed" data-id="'+c.id+'">Editar</button></td></tr>'});
  if(!L.length)h+='<tr><td colspan="5">Nenhum convidado neste filtro.</td></tr>';h+='</table>'}
 else{
  var R=S.reservas.filter(function(r){return r.dia===n.dia});
  h+='<div class="row" style="margin:10px 0"><button class="p s" id="addr">+ Nova reserva</button><span class="sub" style="margin:0">'+n.reservas+' reserva(s) · '+n.publico+' pessoa(s)</span></div>';
  R.forEach(function(r){h+='<div class="res"><div class="row sp"><b>'+esc(r.prot)+'</b> · '+r.pessoas.length+' pessoa(s)<span><button class="s" data-a="rm" data-id="'+esc(r.prot)+'">Mudar de dia</button> <button class="s" data-a="rap" data-id="'+esc(r.prot)+'">+ Pessoa</button> <button class="s d" data-a="rc" data-id="'+esc(r.prot)+'">Cancelar reserva</button></span></div><table class="tb">'+
   r.pessoas.map(function(p){return'<tr><td>'+esc(p.nome)+'</td><td><small>'+esc(p.tel)+'</small></td><td><button class="s" data-a="rep" data-id="'+esc(r.prot)+'" data-l="'+p.linha+'">Editar</button> <button class="s d" data-a="rrp" data-id="'+esc(r.prot)+'" data-l="'+p.linha+'">Remover</button></td></tr>'}).join('')+'</table></div>'});
  if(!R.length)h+='<div class="sub">Nenhuma reserva do público nesta noite.</div>'}
 return h+'</div>'}
function norm(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim()}
function opcoesDia(sel,sem){return S.noites.filter(function(n){return n.dia!==sem}).map(function(n){return'<option value="'+n.dia+'"'+(n.dia===sel?' selected':'')+'>Noite '+n.dia+' · '+esc(n.label)+' ('+n.total+'/'+S.teto+')</option>'}).join('')}
/* modal: campos → envia; se a noite lota, pede confirmação explícita ("forçar") */
function modal(titulo,corpo,botao,envia){var m=document.createElement('div');m.className='mask';m.innerHTML='<div class="mod"><h2>'+titulo+'</h2>'+corpo+'<div class="bad" id="mErr"></div><div class="row" style="margin-top:14px;justify-content:flex-end"><button id="mX">Fechar</button><button class="p" id="mOk">'+botao+'</button></div></div>';document.body.appendChild(m);
 var forcar=false;$('mX').onclick=function(){m.remove()};
 $('mOk').onclick=function(){if(busy)return;busy=true;$('mOk').disabled=true;$('mErr').textContent='';
  envia(forcar,function(r){busy=false;$('mOk').disabled=false;
   if(r&&r.ok===false){if(r.code==='lotado'){forcar=true;$('mErr').innerHTML='<div class="warn">A noite ficaria com <b>'+(r.total+r.adicional)+'</b> pessoas (teto '+r.teto+'). Clique em <b>Confirmar mesmo assim</b> para ultrapassar o teto.</div>';$('mOk').textContent='Confirmar mesmo assim'}else $('mErr').textContent=msgErro(r);return}
   m.remove();S=r;if(r.info&&r.info.protocolo)toast('Reserva criada: '+r.info.protocolo);else toast('Alteração salva');render()})}}
function val(id){return $(id).value}
document.addEventListener('click',function(e){var t=e.target;
 var n=t.closest&&t.closest('.n');if(n&&!t.closest('button')){SEL=Number(n.getAttribute('data-d'));render();return}
 if(t.getAttribute&&t.getAttribute('data-tab')){TAB=t.getAttribute('data-tab');render();return}
 if(t.id==='addc')return novoConv();if(t.id==='addr')return novaRes();
 var a=t.getAttribute&&t.getAttribute('data-a');if(!a)return;var id=t.getAttribute('data-id'),l=t.getAttribute('data-l');
 var c=S.convidados.filter(function(x){return x.id===id})[0],r=S.reservas.filter(function(x){return x.prot===id})[0];
 if(a==='mc')modal('Mudar '+esc(c.nome)+' de noite','<label>Nova noite</label><select id="f1">'+opcoesDia(0,c.dia)+'</select>','Mover',function(f,cb){run('gMoverConvidado',[K,id,Number(val('f1')),f],cb)});
 if(a==='ec')statusConv(c);
 if(a==='ed')modal('Editar convidado','<label>Nome no convite</label><input type="text" id="f1" value="'+esc(c.nome)+'"><label>Direito a acompanhante</label><select id="f2"><option value="0"'+(c.acomp?'':' selected')+'>Não</option><option value="1"'+(c.acomp?' selected':'')+'>Sim</option></select>','Salvar',function(f,cb){run('gEditarConvidado',[K,id,{nome:val('f1'),acomp:Number(val('f2'))}],cb)});
 if(a==='rm')modal('Mudar reserva '+esc(r.prot)+' de noite','<label>Nova noite</label><select id="f1">'+opcoesDia(0,r.dia)+'</select>','Mover',function(f,cb){run('gReservaMover',[K,id,Number(val('f1')),f],cb)});
 if(a==='rc')modal('Cancelar reserva '+esc(r.prot),'<p>'+r.pessoas.map(function(p){return esc(p.nome)}).join(', ')+'</p><p class="sub">A vaga é liberada na hora.</p>','Cancelar reserva',function(f,cb){run('gReservaCancelar',[K,id],cb)});
 if(a==='rap')modal('Incluir pessoa na reserva '+esc(r.prot),'<label>Nome completo</label><input type="text" id="f1"><label>Celular</label><input type="text" id="f2" placeholder="(42) 99999-9999">','Incluir',function(f,cb){run('gReservaPessoa',[K,id,'',val('f1'),val('f2'),f],cb)});
 if(a==='rep'){var p=r.pessoas.filter(function(x){return String(x.linha)===l})[0];modal('Editar pessoa','<label>Nome completo</label><input type="text" id="f1" value="'+esc(p.nome)+'"><label>Celular</label><input type="text" id="f2" value="'+esc(p.tel)+'">','Salvar',function(f,cb){run('gReservaPessoa',[K,id,Number(l),val('f1'),val('f2'),f],cb)})}
 if(a==='rrp')modal('Remover pessoa da reserva','<p>Remover esta pessoa de '+esc(r.prot)+'?</p>','Remover',function(f,cb){run('gReservaRemoverPessoa',[K,id,Number(l)],cb)});
});
document.addEventListener('input',function(e){if(e.target.id==='busca'){BUSCA=e.target.value;var p=e.target.selectionStart;render();var b=$('busca');b.focus();b.setSelectionRange(p,p)}});
document.addEventListener('change',function(e){if(e.target.id==='fil'){FIL=e.target.value;render()}});
function novoConv(){modal('Incluir convidado (exceção)','<label>Nome completo</label><input type="text" id="f1"><label>Noite</label><select id="f2">'+opcoesDia(SEL,0)+'</select><label>Direito a acompanhante</label><select id="f3"><option value="0">Não</option><option value="1">Sim</option></select>','Incluir',function(f,cb){run('gAddConvidado',[K,{nome:val('f1'),dia:Number(val('f2')),acomp:Number(val('f3'))},f],cb)})}
function statusConv(c){modal('Status de '+esc(c.nome),'<label>Novo status</label><select id="f1"><option value="confirmar">Confirmado</option><option value="nao_vai">Não vai</option><option value="pendente">Sem resposta (pendente)</option></select><div id="cf"><label>Nome do titular</label><input type="text" id="f2" value="'+esc(c.titNome||c.nome)+'"><label>Celular do titular (opcional)</label><input type="text" id="f3" value="'+esc(c.titTel)+'">'+(c.acomp?'<label>Acompanhante (deixe em branco se vai sozinho)</label><input type="text" id="f4" value="'+esc(c.acNome)+'"><label>Celular do acompanhante (opcional)</label><input type="text" id="f5" value="'+esc(c.acTel)+'">':'')+'</div>','Salvar',function(f,cb){var a=val('f1');run('gStatusConvidado',[K,c.id,a,a==='confirmar'?{titNome:val('f2'),titTel:val('f3'),acNome:c.acomp?val('f4'):'',acTel:c.acomp?val('f5'):''}:{},f],cb)});
 var m=$('f1');m.onchange=function(){$('cf').style.display=m.value==='confirmar'?'':'none'}}
function novaRes(){var campos='';for(var i=0;i<4;i++)campos+='<label>Pessoa '+(i+1)+(i?' (opcional)':'')+'</label><input type="text" id="n'+i+'" placeholder="Nome completo"><input type="text" id="t'+i+'" placeholder="(42) 99999-9999" style="margin-top:4px">';
 modal('Nova reserva (equipe)','<label>Noite</label><select id="f1">'+opcoesDia(SEL,0)+'</select>'+campos,'Criar reserva',function(f,cb){var p=[];for(var i=0;i<4;i++)p.push({nome:val('n'+i),tel:val('t'+i)});run('gReservaNova',[K,Number(val('f1')),p,f],cb)})}
$('ref').onclick=carregar;carregar();setInterval(function(){if(!document.querySelector('.mask')&&!busy)carregar()},90000);
</script></body></html>
