function msgErro(r){var c=r&&r.code;return c==='sem_permissao'?'Seu perfil é de consulta: não pode alterar.':c==='limite'?'Muitas tentativas. Aguarde alguns minutos.':c==='nao_encontrado'?'Registro não encontrado (já foi alterado?). Atualize a página.':c==='duplicado'?'Já existe um convidado com esse nome.':c==='tem_acompanhante'?'Este convidado confirmou com acompanhante. Altere o status antes de remover o acompanhante.':c==='mesmo_dia'?'A pessoa já está nessa noite.':c==='ultima_pessoa'?'É a última pessoa da reserva. Cancele a reserva inteira.':c==='max_pessoas'?'Máximo de '+r.max+' pessoas por reserva.':c==='tel_duplicado'||c==='invalido'?(r.msg||'Dados inválidos.'):r&&r.erro?'Erro '+esc(r.erro.codigo)+' · ref '+esc(r.erro.ref):'Não foi possível concluir.'}
function podeEditar(){return S&&S.perfil==='GESTAO'}
/* ===== login / troca de senha ===== */
function mostra(v){['login','main'].forEach(function(i){$(i).style.display=i===v?'':'none'})}
function telaLogin(msg){mostra('login');$('login').innerHTML='<div class="lg"><img alt="Das Stammhaus Pub" src="'+LOGOL+'"><div class="rest">Área restrita</div><h1>Painel de gestão</h1><p class="sub">Acesso exclusivo à equipe do Das Stammhaus Pub. Entre com seu usuário e senha.</p>'+(msg?'<div class="bad" id="lgErr">'+esc(msg)+'</div>':'<div class="bad" id="lgErr"></div>')+'<label>Usuário</label><input type="text" id="lgU" autocomplete="username" autocapitalize="none"><label>Senha</label><input type="password" id="lgS" autocomplete="current-password"><button class="p" id="lgB">Entrar</button></div>';
 var go=function(){if(busy)return;var u=$('lgU').value,s=$('lgS').value;if(!u||!s){$('lgErr').textContent='Informe usuário e senha.';return}busy=true;$('lgB').disabled=true;
  run('entrar',[u,s],function(r){busy=false;$('lgB').disabled=false;if(r&&r.ok){guarda(r.sessao);USER={nome:r.nome,perfil:r.perfil};r.trocar?telaTrocar(true):carregar();return}
   $('lgErr').textContent=r&&r.code==='bloqueado'?'Muitas tentativas erradas. Tente novamente em 15 minutos.':r&&r.code==='limite'?'Muitas tentativas. Aguarde alguns minutos.':r&&r.erro?'Erro '+r.erro.codigo+' · ref '+r.erro.ref:'Usuário ou senha incorretos.';$('lgS').value=''})};
 $('lgB').onclick=go;$('lgS').onkeydown=function(e){if(e.key==='Enter')go()};$('lgU').onkeydown=function(e){if(e.key==='Enter')$('lgS').focus()};$('lgU').focus()}
function telaTrocar(forcado){mostra('login');$('login').innerHTML='<div class="lg"><img alt="Das Stammhaus Pub" src="'+LOGOL+'"><h1>'+(forcado?'Crie sua senha':'Alterar senha')+'</h1><p class="sub">'+(forcado?'Primeiro acesso: escolha uma senha só sua para continuar.':'Informe a senha atual e a nova.')+'</p><div class="bad" id="tgErr"></div><label>'+(forcado?'Senha inicial (a que lhe foi passada)':'Senha atual')+'</label><input type="password" id="tgA" autocomplete="current-password"><label>Nova senha (mínimo 8 caracteres)</label><input type="password" id="tgN" autocomplete="new-password"><label>Repita a nova senha</label><input type="password" id="tgR" autocomplete="new-password"><button class="p" id="tgB">Salvar senha</button>'+(forcado?'':'<button id="tgC" style="width:100%;margin-top:8px">Cancelar</button>')+'</div>';
 if($('tgC'))$('tgC').onclick=function(){mostra('main')};
 $('tgB').onclick=function(){if(busy)return;var a=$('tgA').value,n=$('tgN').value,r2=$('tgR').value;if(n!==r2){$('tgErr').textContent='As senhas novas não são iguais.';return}busy=true;$('tgB').disabled=true;
  run('trocarSenha',[SES,a,n],function(r){busy=false;$('tgB').disabled=false;if(r&&r.code==='sessao'){guarda(null);telaLogin('Sessão expirada. Entre novamente.');return}
   if(r&&r.ok){toast('Senha alterada');carregar();return}$('tgErr').textContent=r&&r.msg?r.msg:r&&r.code==='limite'?'Muitas tentativas. Aguarde alguns minutos.':'Não foi possível trocar a senha.'})}}
function sair(){var s=SES;guarda(null);S=null;if(s)google.script.run.withSuccessHandler(function(){}).withFailureHandler(function(){}).sair(s);telaLogin('')}

function carregar(){if(!SES){telaLogin('');return}run('painel',[SES],draw)}
function sessaoExpirou(r){if(r&&r.code==='sessao'){guarda(null);S=null;var m=document.querySelector('.mask');if(m)m.remove();telaLogin('Sessão expirada. Entre novamente.');return true}if(r&&r.code==='trocar'){telaTrocar(true);return true}return false}
