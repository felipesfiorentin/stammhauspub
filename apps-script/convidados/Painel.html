<!DOCTYPE html>
<html lang="pt-BR"><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Painel · Das Stammhaus Pub</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--verde:#113325;--ouro:#B47E00;--laranja:#E04E27;--off:#EAE7DA;--escuro:#0a2016}
*{box-sizing:border-box}html,body{margin:0;background:var(--verde);color:var(--off);font-family:Inter,system-ui,sans-serif;line-height:1.45}
body{min-height:100vh;background:radial-gradient(ellipse at top,#1a4a31 0%,#113325 55%,#0b2418 100%) fixed}
.wrap{max-width:980px;margin:0 auto;padding:24px 16px 48px}
h1{font-family:'Playfair Display',Georgia,serif;font-size:26px;margin:0 0 2px}
.sub{color:#b9b5a6;font-size:13.5px;margin:0 0 18px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;flex-wrap:wrap}
button{font:inherit;font-weight:600;cursor:pointer;border-radius:8px;border:1.5px solid rgba(234,231,218,.4);background:transparent;color:var(--off);padding:8px 14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:14px 0 20px}
.kpi{background:rgba(7,28,18,.5);border:1px solid rgba(180,126,0,.5);border-radius:12px;padding:12px 14px}
.kpi small{display:block;color:#b9b5a6;font-size:12px;text-transform:uppercase;letter-spacing:.08em}
.kpi b{font:700 26px/1.1 'Playfair Display',Georgia,serif}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px}
@media(max-width:480px){.grid{grid-template-columns:1fr}}
.card{background:rgba(7,28,18,.5);border:1px solid rgba(180,126,0,.5);border-radius:14px;padding:16px}
.card h2{font-family:'Playfair Display',Georgia,serif;font-size:19px;margin:0}
.card .at{color:#cfcabb;font-size:13.5px;margin:0 0 10px}
.badge{float:right;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;letter-spacing:.05em}
.disp{background:#2f7a3b;color:#fff}.lot{background:var(--laranja);color:#fff}
.bar{height:16px;border-radius:99px;background:rgba(234,231,218,.15);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.b1{background:#2f7a3b}.b2{background:#8a6a1a}.b3{background:var(--ouro)}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:#b9b5a6;margin:6px 0 10px}
.leg span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
td,th{padding:5px 4px;border-bottom:1px solid rgba(234,231,218,.12);text-align:left;vertical-align:top}th{color:#b9b5a6;font-weight:600;font-size:12px}
td.n,th.n{text-align:right;white-space:nowrap}
details{margin-top:10px}summary{cursor:pointer;color:#d9a62e;font-weight:600;font-size:13.5px}
.sec{font-family:'Playfair Display',Georgia,serif;font-size:20px;margin:26px 0 10px}
.errx{background:rgba(7,28,18,.6);border:1px solid var(--laranja);border-radius:12px;padding:16px;text-align:center}
.mut{color:#b9b5a6;font-size:12.5px}
.tk{--b:57px;position:relative;margin:4px 0 16px;border-radius:8px;overflow:hidden;color:#16241b;background-color:#eee7d3;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .28  0 0 0 0 .15  0 0 0 .22 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"),radial-gradient(ellipse at 50% 40%,#f6f1e1 0%,#eee7d3 55%,#ddd3b6 100%);
  box-shadow:0 10px 26px rgba(0,0,0,.45);
  -webkit-mask:radial-gradient(circle 10px at 0 calc(100% - var(--b)),#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 10px at 100% calc(100% - var(--b)),#0000 98%,#000) right/51% 100% no-repeat;
  mask:radial-gradient(circle 10px at 0 calc(100% - var(--b)),#0000 98%,#000) left/51% 100% no-repeat,radial-gradient(circle 10px at 100% calc(100% - var(--b)),#0000 98%,#000) right/51% 100% no-repeat}
.tk-ph{position:absolute;top:0;bottom:var(--b);background-size:cover;background-position:center;mix-blend-mode:multiply}
.tk-ph.l{left:0;width:29%;-webkit-mask-image:linear-gradient(90deg,#000 62%,#0000);mask-image:linear-gradient(90deg,#000 62%,#0000)}
.tk-ph.r{right:0;width:30%;opacity:.5;-webkit-mask-image:linear-gradient(270deg,#000 55%,#0000);mask-image:linear-gradient(270deg,#000 55%,#0000)}
.tk::before{content:"";position:absolute;inset:6px;border:1.5px solid rgba(22,36,27,.75);border-radius:5px;z-index:2;pointer-events:none}
.tk::after{content:"";position:absolute;inset:10px;border:.75px solid rgba(22,36,27,.4);border-radius:3px;z-index:2;pointer-events:none}
.tk-in{position:relative;z-index:1;display:grid;grid-template-columns:29% 1fr 84px;min-height:200px}
.tk-main{grid-column:2;padding:20px 8px 12px 4px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center}
.tk-top{font:700 9px/1.25 Inter,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:#7a5400}
.tk-logo{flex:1;display:flex;align-items:center;justify-content:center;width:100%;padding:8px 0}
.tk-logo img{max-width:100%;max-height:86px;width:auto;height:auto}
.tk-eb{font:italic 600 13px/1 'Playfair Display',Georgia,serif;color:#16241b;letter-spacing:.04em;margin:-2px 0 8px}.tk-eb.hide{display:none}
.tk-gen{font:italic 600 14px/1.1 'Playfair Display',Georgia,serif;color:#16241b;letter-spacing:.02em}
.tk-stub{grid-column:3;border-left:2px dashed rgba(22,36,27,.55);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 6px;background:rgba(238,231,211,.80);text-align:center}
.tk-stub .dw{font:800 10px/1 Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#7a5400}
.tk-stub .dd{font:800 38px/1 'Playfair Display',Georgia,serif;margin:6px 0 4px;color:#16241b}
.tk-stub .dm{font:700 11px/1 Inter,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:#16241b}
.tk-hr{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;background:#e4dcc3;border-top:1.5px solid rgba(22,36,27,.7);padding:10px 14px 12px;text-align:center}
.tk-hr div+div{border-left:1px solid rgba(22,36,27,.4)}
.tk-hr small{display:block;font:700 9px/1 Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#4c5a4f}
.tk-hr b{display:block;font:800 19px/1.1 'Playfair Display',Georgia,serif;margin-top:5px;color:#16241b}
.tk.wide .tk-ph{display:none}.tk.wide .tk-in{grid-template-columns:1fr 84px;grid-template-rows:auto auto;min-height:0}.tk.wide .tk-main{grid-column:1;grid-row:1;padding:16px 8px 8px 14px}.tk.wide .tk-stub{grid-column:2;grid-row:1}.tk.wide .tk-logo{padding:6px 0}.tk.wide .tk-logo img{max-height:50px}
.tk-wp{display:none;grid-column:1/-1;grid-row:2;aspect-ratio:3/1;background-size:100% 100%;mix-blend-mode:multiply;border-top:1.5px solid rgba(22,36,27,.55)}.tk.wide .tk-wp{display:block}
.tk-pub{width:54px;height:auto;display:block;margin:0 auto 9px;opacity:.9}
.tk .tk-hr{grid-template-columns:repeat(3,minmax(0,1fr));box-sizing:border-box;height:var(--b);padding:0 8px 3px;align-content:center;align-items:center}.tk .tk-hr small{white-space:nowrap}.tk .tk-hr b{font-size:18px;white-space:nowrap}
.tk{margin:0}
.tk .tk-hr .st{font:800 15px/1.1 'Playfair Display',Georgia,serif;margin-top:5px;white-space:nowrap}.st.d{color:#1f6b2c}.st.l{color:#b03a18}.tk-hr small i{font-style:normal;letter-spacing:0;text-transform:none;color:#4c5a4f}
.nc{display:flex;flex-direction:column}.nc .card{border-top-left-radius:0;border-top-right-radius:0;border-top:0;margin-top:-1px;flex:1}

button,select,input{font:inherit}
button{font-weight:600;cursor:pointer;border-radius:8px;border:1.5px solid rgba(234,231,218,.4);background:transparent;color:var(--off);padding:7px 12px}
button:hover{border-color:var(--ouro)}button.p{background:var(--ouro);border-color:var(--ouro);color:#fff}button.d{border-color:var(--laranja);color:#ffb59f}
button.s{padding:4px 9px;font-size:12.5px}button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row.sp{justify-content:space-between}
.tb td,.tb th{vertical-align:middle}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;font-weight:600}
.t-c{background:#1f5b33;color:#cdf3d3}.t-p{background:#6b5410;color:#ffe9a8}.t-n{background:#6a2a1c;color:#ffc9b9}
input[type=text],input[type=search],input[type=password],select{background:#0a2016;color:var(--off);border:1.5px solid rgba(234,231,218,.3);border-radius:8px;padding:8px 10px;max-width:100%}
.res{border:1px solid rgba(234,231,218,.15);border-radius:10px;padding:9px;margin:8px 0}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;padding:14px;z-index:9}
.mod{background:#143a2a;border:1.5px solid var(--ouro);border-radius:14px;padding:18px;max-width:440px;width:100%;max-height:90vh;overflow:auto}
.mod label,.lg label{display:block;font-size:12.5px;color:#cfcbbb;margin:9px 0 3px}.mod input,.mod select,.lg input{width:100%}
.warn{background:#5a3b0a;border-radius:8px;padding:8px 10px;margin:10px 0;font-size:13px}.bad{color:#ffb59f;font-size:13px;margin-top:8px}
.aud{font-size:12.5px;color:#cfcbbb}.aud div{padding:3px 0;border-bottom:1px solid rgba(234,231,218,.08)}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ouro);color:#fff;padding:9px 16px;border-radius:10px;font-weight:600;z-index:10}
.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs button.on{background:var(--off);color:var(--verde);border-color:var(--off)}
.lg{max-width:380px;margin:60px auto 0;background:rgba(7,28,18,.6);border:1px solid rgba(180,126,0,.5);border-radius:14px;padding:22px}
.lg img{height:38px;display:block;margin:0 auto 14px}.lg h1{text-align:center;font-size:22px}.lg .sub{text-align:center}
.lg button.p{width:100%;margin-top:16px}
.nc.sel .tk{outline:2px solid var(--ouro);outline-offset:2px}.nc{cursor:pointer}
.lotx{color:#ffb59f;font-weight:700}
.cons{background:#3a3a1a;border-radius:8px;padding:6px 10px;font-size:12.5px;margin:8px 0}
.err{background:rgba(7,28,18,.6);border:1px solid var(--laranja);border-radius:12px;padding:16px;text-align:center;margin:12px 0}

.lay{display:block}
@media(min-width:1024px){
.wrap{max-width:1480px;padding:28px 32px 56px}
h1{font-size:30px}
.top{position:sticky;top:0;z-index:5;background:linear-gradient(#113325 70%,rgba(17,51,37,0));padding:10px 0 14px;margin:-10px 0 0}
.kpis{grid-template-columns:repeat(5,1fr);gap:14px}.kpi b{font-size:32px}
.grid{grid-template-columns:repeat(2,1fr);gap:18px}
.lay{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(340px,1fr);gap:20px;align-items:start;margin-top:4px}
.rc{position:sticky;top:78px;max-height:calc(100vh - 96px);overflow:auto;padding-right:2px}
.rc .sec{margin-top:0;font-size:18px}.rc .sec~.sec{margin-top:20px}
.tb tr:hover td{background:rgba(234,231,218,.06)}
td,th{padding:7px 6px}
.mod{max-width:520px}
button:hover{border-color:var(--ouro);background:rgba(180,126,0,.15)}button.p:hover{background:#c98d06}
.nc:hover .tk{transform:translateY(-2px)}.nc .tk{transition:transform .15s}
}
@media(min-width:1500px){.grid{grid-template-columns:repeat(4,1fr)}.wrap{max-width:1680px}}

  +'<tr><td>Sem resposta (pessoas contadas · convites)</td><td class="n">'+n.pendentesPessoas+' · '+n.pendentesConvites+'</td></tr><tr><td>Convidados que não vão (convites)</td><td class="n">'+n.naoVaiConvites+'</td></tr>'
  +'<tr><td>Público: reservas · pessoas</td><td class="n">'+n.reservas+' · '+n.publico+'</td></tr><tr><td>Entrada estimada do público</td><td class="n">'+brl(n.receita)+'</td></tr></table></div></div>'});
 h+='</div><div class="lay"><div class="lc">';if(SEL!=null)h+=detalhe(noite(SEL));
 h+='</div><div class="rc">'+whatsCard();
 h+='<h2 class="sec">Últimas movimentações</h2><div class="card"><table><tr><th>Quando</th><th>Origem</th><th>O quê</th></tr>'+(S.atividade.length?S.atividade.map(function(e){return'<tr><td class="n">'+esc(e.quando)+'</td><td>'+esc(e.tipo)+'</td><td>'+esc(e.texto)+'</td></tr>'}).join(''):'<tr><td colspan="3" class="mut">Sem movimentações ainda.</td></tr>')+'</table></div>';
 h+='<h2 class="sec">Alterações da gestão</h2><div class="card"><div class="aud">'+(S.auditoria.length?S.auditoria.map(function(a){return'<div>'+esc(a.quando)+' · <b>'+esc(a.quem)+'</b> · '+esc(a.acao)+' — '+esc(a.det)+'</div>'}).join(''):'<div>Nenhuma alteração registrada.</div>')+'</div></div>';
 h+='</div></div><p class="mut">Regra: teto de '+S.teto+' pessoas por noite (capacidade '+S.capacidade+' + 10%). Convidado sem resposta conta '+(S.pendAc?'titular + acompanhante a que tem direito':'só o titular')+'; confirmado conta as pessoas confirmadas; “não vai”/cancelado libera a vaga.</p>';
 $('app').innerHTML=h}
function detalhe(n){var ed=podeEditar();var h='<div class="card" style="margin-top:14px"><div class="row sp"><h2>Noite '+n.dia+' · '+esc(n.label)+' — pessoas</h2><div class="tabs"><button class="'+(TAB==='conv'?'on':'')+'" data-tab="conv">Convidados</button><button class="'+(TAB==='res'?'on':'')+'" data-tab="res">Reservas do público</button></div></div>'+(ed?'':'<div class="cons">Perfil de consulta: você pode ver tudo, mas não alterar.</div>');
 if(TAB==='conv'){var L=S.convidados.filter(function(c){return c.dia===n.dia});var q=norm(BUSCA);if(q)L=L.filter(function(c){return norm(c.nome+' '+c.titNome+' '+c.acNome).indexOf(q)>=0});if(FIL!=='todos')L=L.filter(function(c){return c.status===FIL});
  h+='<div class="row" style="margin:10px 0"><input type="search" id="busca" placeholder="Buscar nome…" value="'+esc(BUSCA)+'"><select id="fil">'+['todos','Confirmado','Pendente','Não vai'].map(function(f){return'<option'+(f===FIL?' selected':'')+'>'+f+'</option>'}).join('')+'</select>'+(ed?'<button class="p s" id="addc">+ Incluir convidado</button>':'')+'</div>';
  h+='<table class="tb"><tr><th>Convidado</th><th>Status</th><th class="n">Pessoas</th><th>Contato</th><th></th></tr>';
  L.forEach(function(c){var tg=c.status==='Confirmado'?'t-c':c.status==='Pendente'?'t-p':'t-n';
   h+='<tr><td>'+esc(c.nome)+(c.acomp?' <small>(+1)</small>':'')+(c.acNome?'<br><small>c/ '+esc(c.acNome)+'</small>':'')+'</td><td><span class="tag '+tg+'">'+c.status+'</span></td><td class="n">'+c.pessoas+'</td><td><small>'+esc(c.titTel)+'</small></td><td>'+(ed?'<button class="s" data-a="mc" data-id="'+c.id+'">Mudar de dia</button> <button class="s" data-a="ec" data-id="'+c.id+'">Status</button> <button class="s" data-a="ed" data-id="'+c.id+'">Editar</button>':'')+'</td></tr>'});
  if(!L.length)h+='<tr><td colspan="5">Nenhum convidado neste filtro.</td></tr>';h+='</table>'}
 else{var R=S.reservas.filter(function(r){return r.dia===n.dia});h+='<div class="row" style="margin:10px 0">'+(ed?'<button class="p s" id="addr">+ Nova reserva</button>':'')+'<span class="mut">'+n.reservas+' reserva(s) · '+n.publico+' pessoa(s)</span></div>';
  R.forEach(function(r){h+='<div class="res"><div class="row sp"><span><b>'+esc(r.prot)+'</b> · '+r.pessoas.length+' pessoa(s)</span>'+(ed?'<span><button class="s" data-a="rm" data-id="'+esc(r.prot)+'">Mudar de dia</button> <button class="s" data-a="rap" data-id="'+esc(r.prot)+'">+ Pessoa</button> <button class="s d" data-a="rc" data-id="'+esc(r.prot)+'">Cancelar reserva</button></span>':'')+'</div><table class="tb">'+
   r.pessoas.map(function(p){return'<tr><td>'+esc(p.nome)+'</td><td><small>'+esc(p.tel)+'</small></td><td>'+(ed?'<button class="s" data-a="rep" data-id="'+esc(r.prot)+'" data-l="'+p.linha+'">Editar</button> <button class="s d" data-a="rrp" data-id="'+esc(r.prot)+'" data-l="'+p.linha+'">Remover</button>':'')+'</td></tr>'}).join('')+'</table></div>'});
  if(!R.length)h+='<div class="mut">Nenhuma reserva do público nesta noite.</div>'}
 return h+'</div>'}
function whatsCard(){var w=S.whats;if(!w)return'';var c=w.contagem||{};var h='<h2 class="sec">Ingressos por WhatsApp</h2><div class="card"><div class="row sp"><span>Enviados: <b>'+(c.ENVIADO||0)+'</b> · Na fila: <b>'+(c.PENDENTE||0)+'</b> · Falharam: <b>'+(c.FALHOU||0)+'</b> · Sem número: <b>'+(c.SEM_NUMERO||0)+'</b></span><span class="tag '+(w.ativo?'t-c':'t-p')+'">'+(w.ativo?'Envio ligado':'Envio desligado')+'</span></div>';
 if(w.pendencias.length){h+='<table class="tb" style="margin-top:8px"><tr><th>Pessoa</th><th>Noite</th><th>Status</th><th></th></tr>'+w.pendencias.map(function(x){return'<tr><td>'+esc(x.nome)+'<br><small>'+esc(x.ref)+(x.detalhe?' · '+esc(x.detalhe):'')+'</small></td><td>'+x.dia+'</td><td>'+esc(x.status)+(x.tent?' ('+x.tent+')':'')+'</td><td>'+(podeEditar()&&(x.status==='FALHOU'||x.status==='SEM_NUMERO')?'<button class="s" data-a="wr" data-l="'+x.linha+'">Reenviar</button>':'')+'</td></tr>'}).join('')+'</table>'}
 return h+'</div>'}
function norm(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim()}
function opcoesDia(sel,sem){return S.noites.filter(function(n){return n.dia!==sem}).map(function(n){return'<option value="'+n.dia+'"'+(n.dia===sel?' selected':'')+'>Noite '+n.dia+' · '+esc(n.label)+' ('+n.total+'/'+S.teto+')</option>'}).join('')}
function modal(titulo,corpo,botao,envia){var m=document.createElement('div');m.className='mask';m.innerHTML='<div class="mod"><h2>'+titulo+'</h2>'+corpo+'<div class="bad" id="mErr"></div><div class="row" style="margin-top:14px;justify-content:flex-end"><button id="mX">Fechar</button><button class="p" id="mOk">'+botao+'</button></div></div>';document.body.appendChild(m);
 var forcar=false;$('mX').onclick=function(){m.remove()};
 $('mOk').onclick=function(){if(busy)return;busy=true;$('mOk').disabled=true;$('mErr').textContent='';
  envia(forcar,function(r){busy=false;$('mOk').disabled=false;if(sessaoExpirou(r))return;
   if(r&&r.ok===false){if(r.code==='lotado'){forcar=true;$('mErr').innerHTML='<div class="warn">A noite ficaria com <b>'+(r.total+r.adicional)+'</b> pessoas (teto '+r.teto+'). Clique em <b>Confirmar mesmo assim</b> para ultrapassar o teto.</div>';$('mOk').textContent='Confirmar mesmo assim'}else $('mErr').textContent=msgErro(r);return}
   m.remove();S=r;if(r.info&&r.info.protocolo)toast('Reserva criada: '+r.info.protocolo);else toast('Alteração salva');render()})}}
function val(id){return $(id).value}
document.addEventListener('click',function(e){var t=e.target;
 var n=t.closest&&t.closest('.nc');if(n&&!t.closest('button')&&S){SEL=Number(n.getAttribute('data-d'));render();return}
 if(t.getAttribute&&t.getAttribute('data-tab')){TAB=t.getAttribute('data-tab');render();return}
 if(t.id==='addc')return novoConv();if(t.id==='addr')return novaRes();
 var a=t.getAttribute&&t.getAttribute('data-a');if(!a||!S)return;var id=t.getAttribute('data-id'),l=t.getAttribute('data-l');
 var c=S.convidados.filter(function(x){return x.id===id})[0],r=S.reservas.filter(function(x){return x.prot===id})[0];
 if(a==='wr'){if(busy)return;busy=true;run('gWhatsReenviar',[SES,Number(l)],function(r){busy=false;if(sessaoExpirou(r))return;if(r&&r.ok===false){toast(msgErro(r));return}S=r;toast('Reenvio na fila');render()});return}
 if(a==='mc')modal('Mudar '+esc(c.nome)+' de noite','<label>Nova noite</label><select id="f1">'+opcoesDia(0,c.dia)+'</select>','Mover',function(f,cb){run('gMoverConvidado',[SES,id,Number(val('f1')),f],cb)});
 if(a==='ec')statusConv(c);
 if(a==='ed')modal('Editar convidado','<label>Nome no convite</label><input type="text" id="f1" value="'+esc(c.nome)+'"><label>Direito a acompanhante</label><select id="f2"><option value="0"'+(c.acomp?'':' selected')+'>Não</option><option value="1"'+(c.acomp?' selected':'')+'>Sim</option></select>','Salvar',function(f,cb){run('gEditarConvidado',[SES,id,{nome:val('f1'),acomp:Number(val('f2'))}],cb)});
 if(a==='rm')modal('Mudar reserva '+esc(r.prot)+' de noite','<label>Nova noite</label><select id="f1">'+opcoesDia(0,r.dia)+'</select>','Mover',function(f,cb){run('gReservaMover',[SES,id,Number(val('f1')),f],cb)});
 if(a==='rc')modal('Cancelar reserva '+esc(r.prot),'<p>'+r.pessoas.map(function(p){return esc(p.nome)}).join(', ')+'</p><p class="sub">A vaga é liberada na hora.</p>','Cancelar reserva',function(f,cb){run('gReservaCancelar',[SES,id],cb)});
 if(a==='rap')modal('Incluir pessoa na reserva '+esc(r.prot),'<label>Nome completo</label><input type="text" id="f1"><label>Celular</label><input type="text" id="f2" placeholder="(42) 99999-9999">','Incluir',function(f,cb){run('gReservaPessoa',[SES,id,'',val('f1'),val('f2'),f],cb)});
 if(a==='rep'){var p=r.pessoas.filter(function(x){return String(x.linha)===l})[0];modal('Editar pessoa','<label>Nome completo</label><input type="text" id="f1" value="'+esc(p.nome)+'"><label>Celular</label><input type="text" id="f2" value="'+esc(p.tel)+'">','Salvar',function(f,cb){run('gReservaPessoa',[SES,id,Number(l),val('f1'),val('f2'),f],cb)})}
 if(a==='rrp')modal('Remover pessoa da reserva','<p>Remover esta pessoa de '+esc(r.prot)+'?</p>','Remover',function(f,cb){run('gReservaRemoverPessoa',[SES,id,Number(l)],cb)});
});
document.addEventListener('input',function(e){if(e.target.id==='busca'){BUSCA=e.target.value;var p=e.target.selectionStart;render();var b=$('busca');b.focus();b.setSelectionRange(p,p)}});
document.addEventListener('change',function(e){if(e.target.id==='fil'){FIL=e.target.value;render()}});
function novoConv(){modal('Incluir convidado (exceção)','<label>Nome completo</label><input type="text" id="f1"><label>Noite</label><select id="f2">'+opcoesDia(SEL,0)+'</select><label>Direito a acompanhante</label><select id="f3"><option value="0">Não</option><option value="1">Sim</option></select>','Incluir',function(f,cb){run('gAddConvidado',[SES,{nome:val('f1'),dia:Number(val('f2')),acomp:Number(val('f3'))},f],cb)})}
function statusConv(c){modal('Status de '+esc(c.nome),'<label>Novo status</label><select id="f1"><option value="confirmar">Confirmado</option><option value="nao_vai">Não vai</option><option value="pendente">Sem resposta (pendente)</option></select><div id="cf"><label>Nome do titular</label><input type="text" id="f2" value="'+esc(c.titNome||c.nome)+'"><label>Celular do titular (opcional)</label><input type="text" id="f3" value="'+esc(c.titTel)+'">'+(c.acomp?'<label>Acompanhante (deixe em branco se vai sozinho)</label><input type="text" id="f4" value="'+esc(c.acNome)+'"><label>Celular do acompanhante (opcional)</label><input type="text" id="f5" value="'+esc(c.acTel)+'">':'')+'</div>','Salvar',function(f,cb){var a=val('f1');run('gStatusConvidado',[SES,c.id,a,a==='confirmar'?{titNome:val('f2'),titTel:val('f3'),acNome:c.acomp?val('f4'):'',acTel:c.acomp?val('f5'):''}:{},f],cb)});
 var m=$('f1');m.onchange=function(){$('cf').style.display=m.value==='confirmar'?'':'none'}}
function novaRes(){var campos='';for(var i=0;i<4;i++)campos+='<label>Pessoa '+(i+1)+(i?' (opcional)':'')+'</label><input type="text" id="n'+i+'" placeholder="Nome completo"><input type="text" id="t'+i+'" placeholder="(42) 99999-9999" style="margin-top:4px">';
 modal('Nova reserva (equipe)','<label>Noite</label><select id="f1">'+opcoesDia(SEL,0)+'</select>'+campos,'Criar reserva',function(f,cb){var p=[];for(var i=0;i<4;i++)p.push({nome:val('n'+i),tel:val('t'+i)});run('gReservaNova',[SES,Number(val('f1')),p,f],cb)})}
$('ref').onclick=carregar;$('btrocar').onclick=function(){telaTrocar(false)};$('bsair').onclick=sair;
if(SES)carregar();else telaLogin('');
setInterval(function(){if(SES&&S&&!document.querySelector('.mask')&&!busy&&$('main').style.display!=='none')carregar()},60000);
