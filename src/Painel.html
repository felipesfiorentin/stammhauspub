<script>
var SES=null,S=null,SEL=null,VIEW='cal',MES=null,BUSCA='',FIL='todos',busy=false,USER={};

function tk(n,r){
  var b=BANDAS[n.dia],m=String(n.label||'').match(/^([^,]+),\s*(\d{2})\/(\d{2})/),at=String(n.atracao||'').split('·'),pct=String(n.pct).replace('.',',');

 var go=function(){if(busy)return;var u=$('lgU').value,s=$('lgS').value;if(!u||!s){$('lgErr').textContent='Informe usuário e senha.';return}busy=true;$('lgB').disabled=true;

function fmtN(v){return v===''||v===null||v===undefined?'':String(v).replace('.',',')}
function brl(v){return 'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2})}
function contratoResumo(c){if(!c)return'';var t=c.refeicao||[c.cache,c.integrantes,c.consumacao,c.estadia,c.transporte].some(function(x){return x!==''});if(!t)return'<div class="mut" style="margin-top:6px">Contratação: não informada</div>';

 return'<div class="mut" style="margin-top:6px">Contratação (interno): cachê '+brl(c.cache)+' · '+(c.integrantes===''?'—':c.integrantes)+' integrantes · consumação '+brl(c.consumacao)+'/integrante ('+brl(cons)+') · estadia '+brl(c.estadia)+' · transporte '+brl(c.transporte)+' · <b>custo total '+brl(tot)+'</b>'+(c.refeicao?' · <b>refeição da equipe</b> (sem consumação)':'')+'</div>'}
function detalhe(n){var ed=podeEditar();var h='<div class="card" style="margin-top:14px"><div class="row sp"><h2>'+esc(n.label)+' — reservas</h2></div>'+(ed?'':'<div class="cons">Perfil de consulta: você pode ver tudo, mas não alterar.</div>');

 h+='<div class="row" style="margin:10px 0"><input type="search" id="busca" placeholder="Buscar nome ou protocolo…" value="'+esc(BUSCA)+'">'+(ed?'<button class="p s" id="addr">+ Nova reserva</button>':'')+'<span class="mut">'+n.reservas+' reserva(s) · '+n.publico+' pessoa(s)'+(n.bonificadas?' · '+n.bonificadas+' bonificada(s)':'')+'</span></div>';
 R.forEach(function(r){var leg=/^legado/.test(r.origem||''),nb=r.pessoas.filter(function(p){return p.bonif}).length;
  h+='<div class="res"><div class="row sp"><span><b>'+esc(r.prot)+'</b> · '+r.pessoas.length+' pessoa(s)'+(r.andar?' · <small class="mut">'+esc(r.andar)+'</small>':'')+(leg?' <span class="tag t-p">legado</span>':'')+(nb?' <span class="tag t-c">'+(nb===r.pessoas.length?'entrada bonificada':nb+' bonificada(s)')+'</span>':'')+(leg?'<br><small class="mut">'+esc(r.origem)+'</small>':'')+'</span>'+(ed?'<span><button class="s" data-a="rb" data-id="'+esc(r.prot)+'">'+(nb===r.pessoas.length?'Remover bonificação':'Bonificar todos')+'</button> <button class="s" data-a="rm" data-id="'+esc(r.prot)+'">Mudar de dia</button> <button class="s" data-a="rap" data-id="'+esc(r.prot)+'">+ Pessoa</button> <button class="s d" data-a="rc" data-id="'+esc(r.prot)+'">Cancelar reserva</button></span>':'')+'</div><table class="tb">'+
   r.pessoas.map(function(p){return'<tr><td>'+esc(p.nome)+(p.bonif?' <span class="tag t-c">bonificada</span>':'')+'</td><td><small>'+esc(p.tel)+'</small></td><td>'+(leg?'':zapBtn(p.nome,p.tel,n,r.prot,true,p.bonif)+' ')+(ed?'<button class="s" data-a="rbp" data-id="'+esc(r.prot)+'" data-l="'+p.linha+'" data-m="'+(p.bonif?0:1)+'">'+(p.bonif?'Cobrar entrada':'Bonificar')+'</button> <button class="s" data-a="rep" data-id="'+esc(r.prot)+'" data-l="'+p.linha+'">Editar</button> <button class="s d" data-a="rrp" data-id="'+esc(r.prot)+'" data-l="'+p.linha+'">Remover</button>':'')+'</td></tr>'}).join('')+'</table></div>'});
 if(!R.length)h+='<div class="mut">Nenhuma reserva nesta noite.</div>';
 return h+'</div>'}
function whatsCard(){var w=S.whats;if(!w)return'';var c=w.contagem||{};var h='<h2 class="sec">Ingressos por WhatsApp</h2><div class="card"><div class="row sp"><span>Enviados: <b>'+(c.ENVIADO||0)+'</b> · Na fila: <b>'+(c.PENDENTE||0)+'</b> · Falharam: <b>'+(c.FALHOU||0)+'</b> · Sem número: <b>'+(c.SEM_NUMERO||0)+'</b></span><span class="tag '+(w.ativo?'t-c':'t-p')+'">'+(w.ativo?'Envio ligado':'Envio desligado')+'</span></div>';

function norm(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim()}
function opcoesDia(sel,sem){return S.noites.filter(function(n){return n.dia!==sem&&n.iso>=S.hoje}).map(function(n){return'<option value="'+n.dia+'"'+(n.dia===sel?' selected':'')+'>'+esc(n.label)+' ('+n.total+'/'+n.teto+')</option>'}).join('')}

 $('mOk').onclick=function(){if(busy)return;busy=true;$('mOk').disabled=true;$('mErr').textContent='';
  envia(forcar,function(r){busy=false;$('mOk').disabled=false;if(sessaoExpirou(r))return;
   if(r&&r.ok===false){if(r.code==='lotado'){forcar=true;$('mErr').innerHTML='<div class="warn">A noite ficaria com <b>'+(r.total+r.adicional)+'</b> pessoas (teto '+r.teto+'). Clique em <b>Confirmar mesmo assim</b> para ultrapassar o teto.</div>';$('mOk').textContent='Confirmar mesmo assim'}else $('mErr').textContent=msgErro(r);return}
   m.remove();S=r;if(r.info&&r.info.protocolo)toast('Reserva criada: '+r.info.protocolo);else toast('Alteração salva');render()})}}

 if(a==='rbp'){if(busy)return;busy=true;run('gReservaBonificar',[SES,id,[Number(l)],t.getAttribute('data-m')==='1'],function(x){busy=false;if(sessaoExpirou(x))return;if(x&&x.ok===false){toast(msgErro(x));return}S=x;toast(t.getAttribute('data-m')==='1'?'Entrada bonificada marcada':'Bonificação removida');render()});return}

 if(a==='rc')modal('Cancelar reserva '+esc(r.prot),'<p>'+r.pessoas.map(function(p){return esc(p.nome)}).join(', ')+'</p><p class="sub">A vaga é liberada na hora.</p>','Cancelar reserva',function(f,cb){run('gReservaCancelar',[SES,id],cb)});
 if(a==='rap')modal('Incluir pessoas na reserva '+esc(r.prot),'<label>Nomes completos (um por linha)</label><textarea id="f1" rows="6" placeholder="Maria Souza&#10;João Pereira"></textarea><label style="display:flex;gap:8px;align-items:center;margin-top:10px"><input type="checkbox" id="f2" style="width:auto"> Entrada bonificada (não cobrar)</label>','Incluir',function(f,cb){var bn=$('f2').checked,lista=val('f1').split(/\n/).map(function(x){var q=x.split(';');return{nome:(q[0]||'').trim(),tel:(q[1]||'').trim(),bonif:bn}}).filter(function(x){return x.nome||x.tel});run('gReservaPessoas',[SES,id,lista,f],cb)});
 if(a==='rep'){var p=r.pessoas.filter(function(x){return String(x.linha)===l})[0];modal('Editar pessoa','<label>Nome completo</label><input type="text" id="f1" value="'+esc(p.nome)+'"><label>Celular (opcional)</label><input type="text" id="f2" value="'+esc(p.tel)+'">','Salvar',function(f,cb){run('gReservaPessoa',[SES,id,Number(l),val('f1'),val('f2'),f],cb)})}
 if(a==='rrp')modal('Remover pessoa da reserva','<p>Remover esta pessoa de '+esc(r.prot)+'?</p>','Remover',function(f,cb){run('gReservaRemoverPessoa',[SES,id,Number(l)],cb)});
});
